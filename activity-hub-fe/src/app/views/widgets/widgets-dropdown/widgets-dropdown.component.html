<c-row class="g-4 mb-4">
  <!-- Card 1: Users -->
  <c-col sm="6" xl="3">
    <c-card class="text-white bg-primary shadow-sm h-100">
      <c-card-body class="pb-3 d-flex flex-column justify-content-between">
        <div>
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="fs-4 fw-semibold">2,650</div>
              <div class="small text-white-50">Người dùng hệ thống</div>
            </div>
            <div class="p-2 bg-white bg-opacity-25 rounded">
              <svg cIcon name="cilUser" size="xl"></svg>
            </div>
          </div>
        </div>
        <div class="mt-3 pt-2 border-top border-white border-opacity-25 small">
          <a routerLink="/users" class="text-white text-decoration-none d-flex align-items-center justify-content-between">
            <span>Xem chi tiết</span>
            <svg cIcon name="cilArrowRight" size="sm"></svg>
          </a>
        </div>
      </c-card-body>
    </c-card>
  </c-col>

  <!-- Card 2: Orders -->
  <c-col sm="6" xl="3">
    <c-card class="text-white bg-info shadow-sm h-100">
      <c-card-body class="pb-3 d-flex flex-column justify-content-between">
        <div>
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="fs-4 fw-semibold">1,420</div>
              <div class="small text-white-50">Đơn hàng thành công</div>
            </div>
            <div class="p-2 bg-white bg-opacity-25 rounded">
              <svg cIcon name="cilBasket" size="xl"></svg>
            </div>
          </div>
        </div>
        <div class="mt-3 pt-2 border-top border-white border-opacity-25 small">
          <a routerLink="/orders/list" class="text-white text-decoration-none d-flex align-items-center justify-content-between">
            <span>Danh sách đơn hàng</span>
            <svg cIcon name="cilArrowRight" size="sm"></svg>
          </a>
        </div>
      </c-card-body>
    </c-card>
  </c-col>

  <!-- Card 3: Sales Revenue -->
  <c-col sm="6" xl="3">
    <c-card class="text-white bg-success shadow-sm h-100">
      <c-card-body class="pb-3 d-flex flex-column justify-content-between">
        <div>
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="fs-4 fw-semibold">89,250,000 đ</div>
              <div class="small text-white-50">Doanh thu tháng</div>
            </div>
            <div class="p-2 bg-white bg-opacity-25 rounded">
              <svg cIcon name="cilDollar" size="xl"></svg>
            </div>
          </div>
        </div>
        <div class="mt-3 pt-2 border-top border-white border-opacity-25 small">
          <a routerLink="/orders/create" class="text-white text-decoration-none d-flex align-items-center justify-content-between">
            <span>Bán hàng mới</span>
            <svg cIcon name="cilArrowRight" size="sm"></svg>
          </a>
        </div>
      </c-card-body>
    </c-card>
  </c-col>

  <!-- Card 4: Roles & Security -->
  <c-col sm="6" xl="3">
    <c-card class="text-white bg-warning shadow-sm h-100">
      <c-card-body class="pb-3 d-flex flex-column justify-content-between">
        <div>
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="fs-4 fw-semibold">4 Vai trò</div>
              <div class="small text-white-50">Phân quyền & Bảo mật</div>
            </div>
            <div class="p-2 bg-white bg-opacity-25 rounded">
              <svg cIcon name="cilShieldAlt" size="xl"></svg>
            </div>
          </div>
        </div>
        <div class="mt-3 pt-2 border-top border-white border-opacity-25 small">
          <a routerLink="/roles" class="text-white text-decoration-none d-flex align-items-center justify-content-between">
            <span>Quản lý vai trò</span>
            <svg cIcon name="cilArrowRight" size="sm"></svg>
          </a>
        </div>
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
