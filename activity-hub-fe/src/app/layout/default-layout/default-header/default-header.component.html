<ng-container>
  <c-container [fluid]="true" class="border-bottom px-4">
    <!-- Sidebar Toggle Button -->
    <button
      [cSidebarToggle]="sidebarId()"
      aria-label="Toggle sidebar navigation"
      cHeaderToggler
      class="btn"
      style="margin-inline-start: -14px"
      toggle="visible"
    >
      <svg cIcon name="cilMenu" size="lg"></svg>
    </button>

    <!-- Right-aligned Header Navigation: Theme & Profile -->
    <c-header-nav class="ms-auto d-flex align-items-center gap-3">
      <!-- Theme Switcher -->
      <ng-container *ngTemplateOutlet="themeDropdown" />

      <div class="vr h-50 my-auto text-body text-opacity-25"></div>

      <!-- User Profile Dropdown -->
      <ng-container *ngTemplateOutlet="userDropdown" />
    </c-header-nav>
  </c-container>

  <!-- Breadcrumbs -->
  <c-container [fluid]="true" class="px-4">
    <c-breadcrumb-router />
  </c-container>
</ng-container>

<!-- USER PROFILE DROPDOWN TEMPLATE -->
<ng-template #userDropdown>
  <c-dropdown [popperOptions]="{ placement: 'bottom-end' }" variant="nav-item">
    <button [caret]="false" aria-label="Open user menu" cDropdownToggle class="btn py-0 pe-0 d-flex align-items-center gap-2 border-0 bg-transparent">
      <div class="text-end d-none d-md-block lh-sm">
        <div class="fw-bold small text-body">{{ getUserDisplayName() }}</div>
        <div class="text-body-secondary" style="font-size: 0.72rem;">{{ getUserRole() }}</div>
      </div>
      <c-avatar
        alt="User avatar"
        shape="rounded-circle"
        size="md"
        src="./assets/images/avatars/8.jpg"
        status="success"
        textColor="primary"
      />
    </button>
    <ul cDropdownMenu class="pt-0 w-auto shadow border-0 mt-2">
      <li>
        <div class="bg-body-secondary p-3 rounded-top">
          <div class="fw-bold text-body">{{ getUserDisplayName() }}</div>
          <div class="small text-body-secondary font-monospace">&#64;{{ currentUser()?.username || 'user' }}</div>
          <div class="mt-1">
            <c-badge color="primary" class="font-monospace">{{ getUserRole() }}</c-badge>
          </div>
        </div>
      </li>
      <li><hr cDropdownDivider class="my-1" /></li>
      <li>
        <a cDropdownItem routerLink="/users" class="d-flex align-items-center py-2">
          <svg cIcon class="me-2 text-primary" name="cilUser"></svg>
          Quản lý tài khoản
        </a>
      </li>
      <li>
        <a cDropdownItem routerLink="/orders/list" class="d-flex align-items-center py-2">
          <svg cIcon class="me-2 text-info" name="cilNotes"></svg>
          Đơn hàng của tôi
        </a>
      </li>
      <li>
        <a cDropdownItem routerLink="/activity-logs" class="d-flex align-items-center py-2">
          <svg cIcon class="me-2 text-warning" name="cilListNumbered"></svg>
          Nhật ký hoạt động
        </a>
      </li>
      <li><hr cDropdownDivider class="my-1" /></li>
      <li>
        <button cDropdownItem class="d-flex align-items-center py-2 text-danger w-100 border-0 bg-transparent" (click)="logout()">
          <svg cIcon class="me-2" name="cilAccountLogout"></svg>
          Đăng xuất
        </button>
      </li>
    </ul>
  </c-dropdown>
</ng-template>

<!-- THEME DROPDOWN TEMPLATE -->
<ng-template #themeDropdown>
  <c-dropdown alignment="end" variant="nav-item">
    <button [caret]="false" aria-label="Open theme picker" cDropdownToggle class="btn p-1 border-0 bg-transparent">
      <svg [name]="icons()" cIcon size="lg"></svg>
    </button>
    <div cDropdownMenu class="shadow border-0 mt-2">
      @for (mode of colorModes; track mode.name) {
      <button
        (click)="colorMode.set(mode.name)"
        [active]="colorMode() === mode.name"
        cDropdownItem
        class="d-flex align-items-center py-2"
      >
        <svg [name]="mode.icon" cIcon class="me-2" size="lg"></svg>
        {{ mode.text }}
      </button>
      }
    </div>
  </c-dropdown>
</ng-template>
